name: Upstream sync + re-apply overrides

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "profilarr-sync-bot"
          git config user.email "lordmata94@gmail.com"

      - name: Add upstream + fetch
        run: |
          git remote add upstream https://github.com/Dictionarry-Hub/database
          git fetch upstream stable

      - name: Detect drift
        id: drift
        run: |
          if git merge-base --is-ancestor upstream/stable HEAD; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "Fork already includes upstream/stable. Nothing to do."
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch
        if: steps.drift.outputs.needs_sync == 'true'
        id: branch
        run: |
          BR="sync/upstream-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BR"
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Merge upstream (favor upstream on conflict)
        if: steps.drift.outputs.needs_sync == 'true'
        run: |
          if ! git merge upstream/stable --no-edit -X theirs; then
            echo "merge failed despite -X theirs; hard reset to upstream"
            git merge --abort || true
            git reset --hard upstream/stable
          fi

      - name: Apply local overrides
        if: steps.drift.outputs.needs_sync == 'true'
        run: bash scripts/apply-overrides.sh

      - name: Commit overrides
        if: steps.drift.outputs.needs_sync == 'true'
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(overrides): re-apply local overrides after upstream sync"
          else
            echo "No override drift to commit."
          fi

      - name: Push branch
        if: steps.drift.outputs.needs_sync == 'true'
        run: git push origin "${{ steps.branch.outputs.name }}"

      - name: Open PR
        if: steps.drift.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base stable \
            --head "${{ steps.branch.outputs.name }}" \
            --title "sync: upstream Dictionarry-Hub/database + re-apply overrides" \
            --body "Automated weekly upstream sync. Local overrides re-applied via \`scripts/apply-overrides.sh\`."
